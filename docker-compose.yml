services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=dev_secret_key_123
      - DATABASE_URL=postgres://postgres:disaster_secret_2024@db:5432/disasterdb
      - AI_SERVICE_URL=http://ai-service:8000
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=disaster_secret_2024
      - POSTGRES_DB=disasterdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disasterdb"]
      interval: 5s
      timeout: 5s
      retries: 5
