services:
  server:
    build: ./server
    ports:
      - "9876:9876"
    environment:
      - PORT=9876
      - JWT_SECRET=dev_secret_key_123
      - DATABASE_URL=postgres://postgres:disaster_secret_2024@db:5432/disasterdb
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=disaster_secret_2024
      - POSTGRES_DB=disasterdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disasterdb"]
      interval: 5s
      timeout: 5s
      retries: 5
