name: SentinelGrid CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Frontend Checks (React / Vite)
    - name: Setup Node.js (Frontend)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './client/package-lock.json'
        
    - name: Install Client Dependencies
      working-directory: ./client
      run: npm ci

    - name: Build Client
      working-directory: ./client
      run: npm run build

    # 2. Backend Checks (Node / Express)
    - name: Setup Node.js (Backend)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './server/package-lock.json'
        
    - name: Install Server Dependencies
      working-directory: ./server
      run: npm ci
      
    - name: Run Server Tests
      working-directory: ./server
      run: npm test
      continue-on-error: true # Continues if tests aren't configured yet

    # 3. AI Service Checks (Python / FastAPI)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Python Dependencies
      working-directory: ./ai-service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Docker Build Check
    # Ensures that the entire architecture containerizes correctly
    - name: Test Docker Compose Build
      run: docker-compose build
      env:
        GEMINI_API_KEY: "dummy-key-for-build"
        GOOGLE_MAPS_API_KEY: "dummy-key-for-build"
